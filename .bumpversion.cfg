[bumpversion]
current_version = 0.5.0
commit = true
tag = true

[bumpversion:file:README.md]
search = Version: `{current_version}`
replace = Version: `{new_version}`

[bumpversion:file:src/erltoken.app.src]
search = {{vsn, "{current_version}"}}
replace = {{vsn, "{new_version}"}}

[bumpversion:file:native/erltoken_nif/Cargo.toml]
search = version = "{current_version}"
replace = version = "{new_version}"

[bumpversion:file:native/erltoken_nif/Cargo.lock]
search = 
	[[package]]
	name = "erltoken_nif"
	version = "{current_version}"
replace = 
	[[package]]
	name = "erltoken_nif"
	version = "{new_version}"
