name: Publish Hex

on:
  push:
    tags:
      - 'v*'
  repository_dispatch:
    types: [publish-hex]
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to publish, for example v0.2.0
        required: false
        type: string

permissions:
  contents: read

jobs:
  publish:
    name: Publish Package
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.client_payload.tag || inputs.tag || github.ref }}

      - name: Set up Erlang and Rebar3
        uses: erlef/setup-beam@v1
        with:
          otp-version: '28'
          rebar3-version: '3'

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Run tests
        run: rebar3 eunit

      - name: Publish to Hex
        run: rebar3 hex publish --repo hexpm --yes
        env:
          HEX_API_KEY: ${{ secrets.HEX_API_KEY }}
